<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="JU Assignments is a clean semester-wise archive for assignment files stored in the assignments folder."
  >
  <title>JU Assignments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css?v=3">
  <link rel="stylesheet" href="assets/css/components.css?v=5">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <div class="brand-group">
        <div class="brand-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            <line x1="9" y1="7" x2="15" y2="7"/>
            <line x1="9" y1="11" x2="13" y2="11"/>
          </svg>
        </div>
        <div>
          <h1 class="brand">JU Assignments</h1>
          <p class="site-caption">Semester-wise assignment archive</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="file-count-badge" title="Total assignments indexed">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <span id="totalAssignments">0</span> files
        </span>
        <a href="https://github.com/Whit31ister/JU_ASSIGN" target="_blank" rel="noreferrer" class="github-link" title="View repository on GitHub" aria-label="GitHub repository">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
        </a>
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="theme-icon sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span class="theme-label">Dark Mode</span>
        </button>
      </div>
    </header>

    <main class="page-grid">
      <div class="search-container">
        <div class="search-box">
          <span class="search-icon-box" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input id="searchInput" type="search" placeholder="Search assignments, subjects, files..." autocomplete="off" spellcheck="false">
          <div class="search-hints">
            <button id="clearSearchBtn" class="clear-search-btn" aria-label="Clear search" title="Clear search" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
            <kbd class="search-kbd" title="Press / to focus search">/</kbd>
          </div>
        </div>
      </div>

      <div class="content-header">
        <div id="breadcrumbList" class="breadcrumbs">
          <button class="breadcrumb-link" data-index="-1">Home</button>
        </div>
      </div>

      <div class="content-grid">
        <section class="card list-card">
          <div id="assignmentList" class="assignment-list" aria-live="polite"></div>
          <div id="emptyState" class="empty-state" hidden>
            <h3>No files found</h3>
            <p>Adjust your search or try a different folder.</p>
          </div>
        </section>

        <div class="right-column">
          <aside id="detailPanel" class="card detail-card">
            <p class="detail-kicker">File details</p>
            <h3>Select a file</h3>
            <p class="detail-text">Click a file to view its metadata here.</p>
          </aside>

          <aside id="contributorsPanel" class="card contributors-card">
            <p class="detail-kicker">Contributors</p>
            <div id="contributorsList" class="contributors-list"></div>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <div id="fileViewerModal" class="modal" hidden>
    <div class="modal-content">
      <header class="modal-header">
        <h3 id="modalTitle">File Viewer</h3>
        <div class="viewer-controls">
          <button id="zoomOutBtn" class="icon-button" aria-label="Zoom Out" title="Zoom Out">−</button>
          <button id="zoomInBtn" class="icon-button" aria-label="Zoom In" title="Zoom In">+</button>
          <button id="closeModalBtn" class="icon-button close-icon" aria-label="Close" title="Close">×</button>
        </div>
      </header>
      <div id="modalBody" class="modal-body">
        <!-- Content will be injected here -->
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
  <script src="https://unpkg.com/docx-preview/dist/docx-preview.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    if (window.mermaid) {
      mermaid.initialize({ 
        startOnLoad: false, 
        theme: document.documentElement.classList.contains('dark') ? 'dark' : 'default' 
      });
    }
  </script>
  
  <script defer src="assets/js/core/config.js"></script>
  <script defer src="assets/js/core/parser.js"></script>
  <script defer src="assets/js/services/catalog.js"></script>
  <script defer src="assets/js/ui/render.js?v=7"></script>
  <script defer src="assets/js/app.js?v=3"></script>
</body>
</html>
