<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="JU Assignments is a clean semester-wise archive for assignment files stored in the assignments folder."
  >
  <title>JU Assignments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css?v=2">
  <link rel="stylesheet" href="assets/css/components.css?v=4">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <div>
        <p class="brand">JU Assignments</p>
        <p class="site-caption">Semester-wise assignment archive</p>
      </div>
      <div class="header-actions">
        <span class="file-count-badge"><span id="totalAssignments">0</span> files</span>
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">Dark Mode</button>
      </div>
    </header>

    <main class="page-grid">
      <div class="search-bar">
        <input id="searchInput" type="search" placeholder="Search by title, subject, file name">
      </div>

      <div class="content-header">
        <div id="breadcrumbList" class="breadcrumbs">
          <button class="breadcrumb-link" data-index="-1">Home</button>
        </div>
      </div>

      <div class="content-grid">
        <section class="card list-card">
          <div id="assignmentList" class="assignment-list" aria-live="polite"></div>
          <div id="emptyState" class="empty-state" hidden>
            <h3>No files found</h3>
            <p>Adjust your search or try a different folder.</p>
          </div>
        </section>

        <div class="right-column">
          <aside id="detailPanel" class="card detail-card">
            <p class="detail-kicker">File details</p>
            <h3>Select a file</h3>
            <p class="detail-text">Click a file to view its metadata here.</p>
          </aside>

          <aside id="contributorsPanel" class="card contributors-card">
            <p class="detail-kicker">Contributors</p>
            <div id="contributorsList" class="contributors-list"></div>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <div id="fileViewerModal" class="modal" hidden>
    <div class="modal-content">
      <header class="modal-header">
        <h3 id="modalTitle">File Viewer</h3>
        <div class="viewer-controls">
          <button id="zoomOutBtn" class="icon-button" aria-label="Zoom Out" title="Zoom Out">−</button>
          <button id="zoomInBtn" class="icon-button" aria-label="Zoom In" title="Zoom In">+</button>
          <button id="closeModalBtn" class="icon-button close-icon" aria-label="Close" title="Close">×</button>
        </div>
      </header>
      <div id="modalBody" class="modal-body">
        <!-- Content will be injected here -->
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
  <script src="https://unpkg.com/docx-preview/dist/docx-preview.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    if (window.mermaid) {
      mermaid.initialize({ 
        startOnLoad: false, 
        theme: document.documentElement.classList.contains('dark') ? 'dark' : 'default' 
      });
    }
  </script>
  
  <script defer src="assets/js/core/config.js"></script>
  <script defer src="assets/js/core/parser.js"></script>
  <script defer src="assets/js/services/catalog.js"></script>
  <script defer src="assets/js/ui/render.js?v=7"></script>
  <script defer src="assets/js/app.js?v=2"></script>
</body>
</html>
