        </div>
      </div>
      <div class="header-actions">

    <main class="page-grid">

          </div>
        </nav>
      </div>

      <div class="content-grid">
        <section class="card list-card" aria-labelledby="libraryHeading">
          <h2 id="libraryHeading" class="sr-only">Course Library</h2>
          <div id="assignmentList" class="assignment-list" aria-live="polite"></div>
          <div id="emptyState" class="empty-state" hidden>
            <h3>No files found</h3>
            <p>Adjust your search or try a different folder.</p>
          </div>
        </section>

        <div class="right-column">
          <aside id="detailPanel" class="card detail-card" aria-labelledby="detailHeading">
            <h2 id="detailHeading" class="detail-kicker">File Details</h2>
            <h3 id="selectedFileTitle">Select a file</h3>
            <p class="detail-text">Click a file to view its metadata here.</p>
          </aside>

          <aside id="contributorsPanel" class="card contributors-card" aria-labelledby="contributorsHeading">
            <h2 id="contributorsHeading" class="detail-kicker">Contributors</h2>
            <div id="contributorsList" class="contributors-list"></div>
          </aside>
        </div>
      </div>
    </main>

          <li><a href="assignments/SEM-3/">Semester 3 Course Materials (Computer Networks, Discrete Mathematics, Operating Systems)</a></li>
          <li><a href="assignments/manifest.json">Full Catalog Manifest (JSON)</a></li>
          <li><a href="sitemap.xml">XML Sitemap</a></li>
        </ul>
      </section>
    </noscript>

      <header class="modal-header">
        <h2 id="modalTitle">File Viewer</h2>
        <div class="viewer-controls">
          <button id="zoomOutBtn" class="icon-button" aria-label="Zoom Out" title="Zoom Out">−</button>
          <button id="zoomInBtn" class="icon-button" aria-label="Zoom In" title="Zoom In">+</button>
          <button id="closeModalBtn" class="icon-button close-icon" aria-label="Close" title="Close">×</button>
        </div>
      </header>
      <div id="modalBody" class="modal-body">
        <!-- Content injected dynamically -->
      </div>
    </div>
